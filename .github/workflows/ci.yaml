name: ci

# Every push to a plynic/* branch builds everything (iOS device, iOS
# simulator, macOS; arm64) and runs the checks. A tag v*-plynic.* also
# publishes the release: the two xcframeworks archives, dsyms-plynic.zip,
# manifest.json and the corresponding source (sources/*). Tags with "rc" in
# them are prereleases. A pushed tag is never moved: a release that needs
# another build gets the next number.
#
# Third-party actions are pinned by commit (the tag they were taken from in
# the comment). Only the release job, which runs for tags and builds
# nothing, can write to the repository.
on:
  push:
    branches:
      - "plynic/**"
    tags:
      - "v*-plynic.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Platform info
        run: |
          sw_vers
          uname -m
          sysctl -n hw.ncpu
          df -h /

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Nix version
        run: nix --version

      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        continue-on-error: true
        with:
          use-flakehub: false

      # The runner image's default Xcode; its version goes into manifest.json
      # (toolchain), so nothing here names a particular Xcode.
      - name: Xcode
        id: xcode
        run: |
          XCODE_PATH=$(realpath "$(xcode-select -p)/../..")
          "$XCODE_PATH/Contents/Developer/usr/bin/xcodebuild" -version
          echo "xcode_path=$XCODE_PATH" >> "$GITHUB_OUTPUT"

      - name: Version
        id: version
        run: |
          VERSION=develop
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          XCODE_PATH: ${{ steps.xcode.outputs.xcode_path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix develop -c make XCODE_PATH="$XCODE_PATH" VERSION="$VERSION"

      # Load the macOS frameworks the way an app links them: versions and
      # the decoders/demuxers plynic relies on.
      - name: Probe
        run: tools/probe/run.sh dist --check

      # --sub-keepout through the render API's software renderer, and a
      # subtitle track selected while paused showing up.
      - name: Keepout
        run: tools/keepout/run.sh dist sw

      # screenshot-raw through the render API. The runner (a VM) has no
      # OpenGL context, so the gl runs - VideoToolbox frames, the ones that
      # need downloading - say SKIP here and are run on a Mac
      # (tools/shot/run.sh dist gl strict); the software renderer's runs
      # check the rest of the path.
      - name: Screenshot
        run: |
          tools/shot/run.sh dist gl
          tools/shot/run.sh dist sw

      - name: Manifest
        run: |
          python3 -c 'import json; m = json.load(open("dist/manifest.json")); print(json.dumps({k: m[k] for k in ("tag", "mpv_commit", "mpv_version", "ffmpeg_version", "deps", "toolchain", "checks")}, indent=2))'
          ls -la dist dist/sources

      - name: Keep the release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/dsyms-plynic.zip
            dist/manifest.json
            dist/sources/

  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Files
        run: ls -laR dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/dsyms-plynic.zip
            dist/manifest.json
            dist/sources/*
