[constants]
arch          = 'arm64'
platform_name = 'iPhoneOS'
target        = ['-target', 'arm64-apple-ios15.0']
xcode         = '/Applications/Xcode.app'
xctoolchain   = xcode + '/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin'
xcplatform    = xcode + '/Contents/Developer/Platforms/' + platform_name + '.platform/Developer/SDKs/' + platform_name + '.sdk'
# -g: every library is compiled with debug info, so that the release can ship
# dSYMs (dsymutil runs where the objects still exist, see the packages'
# install phases); the frameworks themselves are stripped of local symbols.
common_args   = target + ['-arch', arch, '-isysroot', xcplatform, '-miphoneos-version-min=15.0', '-g']

[host_machine]
system     = 'darwin'
cpu_family = 'aarch64'
cpu        = 'arm64'
endian     = 'little'

[binaries]
c          = xctoolchain + '/clang'
cpp        = xctoolchain + '/clang++'
objc       = xctoolchain + '/clang'
objcpp     = xctoolchain + '/clang++'
nm         = xctoolchain + '/nm'
ar         = xctoolchain + '/ar'
strip      = xctoolchain + '/strip'
lipo       = xctoolchain + '/lipo'
strings    = xctoolchain + '/strings'
ranlib     = xctoolchain + '/ranlib'
pkg-config = 'pkg-config'

[built-in options]
buildtype        = 'release'
c_args           = common_args
cpp_args         = common_args + ['-stdlib=libc++']
objc_args        = common_args
objcpp_args      = common_args + ['-stdlib=libc++']
c_link_args      = common_args
cpp_link_args    = common_args
objc_link_args   = common_args
objcpp_link_args = common_args

[properties]
cmake_osx_sysroot = xcplatform
cross_prefix      = xctoolchain
